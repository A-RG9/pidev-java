# Database configuration — Wellora Merged Project
# IMPORTANT: Update the URL, username, and password to match your MySQL setup
#
# The integ (JournalSante) module uses the 'wellora_health' database (see schema.sql)
# The nutrition module uses the 'wellora' database
# You can use a SINGLE database by running both schema files into the same DB
# and changing both URLs below to point to the same database.
#
# Default: port 3306 (standard MySQL). Change to 3307 if using XAMPP default.
db.url=jdbc:mysql://localhost:3306/wellora
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver
